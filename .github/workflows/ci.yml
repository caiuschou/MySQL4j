name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The MySQL archives (about 260 MB) are downloaded by the db modules into tmpDir/input.
      - uses: actions/cache@v4
        with:
          path: tmpDir/input
          key: mysql-archives-${{ hashFiles('mysql4j-db-*/prepare.xml', 'pom.xml') }}

      - name: Install runtime libraries for mysqld (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libaio1t64 libnuma1 || sudo apt-get install -y libaio1 libnuma1

      - name: Build and test
        run: mvn -B -ntp install

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: '**/target/surefire-reports/'
